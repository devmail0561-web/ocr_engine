[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amanda-ocr"
version = "0.1.0"
description = "Moteur OCR adaptatif pour images et PDFs"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "Pillow",
    "pytesseract",
    "PyMuPDF",
]

[project.optional-dependencies]
easyocr = ["easyocr"]
gui = ["customtkinter"]
dev = ["easyocr", "customtkinter"]

[project.scripts]
amanda-cli = "amanda_ocr.dynamic_ocr:cli_main"
amanda-gui = "amanda_ocr.gui:main"

[tool.setuptools.packages.find]
include = ["amanda_ocr*"]
